[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-robot-edge-core"
version = "0.1.0"
description = "Durable ROS-independent Office Robot edge protocol"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["robot_edge_gateway*"]
